# This CRD is supplied by the AKS Azure Monitor metrics add-on.
apiVersion: azmonitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: landing-zone-demo-frontend
  namespace: demo
spec:
  # Azure Managed Prometheus requires explicit label limits on custom
  # PodMonitor resources; without them the custom scrape can be discarded.
  labelLimit: 63
  labelNameLengthLimit: 511
  labelValueLengthLimit: 1023
  selector:
    matchLabels:
      app: landing-zone-demo-frontend
  podMetricsEndpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
