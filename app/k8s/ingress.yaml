apiVersion: networking.k8s.io/v1
kind: Ingress
# Superseded legacy diagnostic path. This resource is intentionally excluded
# from kustomization.yaml because the corrected architecture uses an internal
# LoadBalancer Service as the APIM backend and does not enable AGIC.
metadata:
  name: landing-zone-demo-app
  namespace: demo
  annotations:
    kubernetes.io/ingress.class: azure/application-gateway # AGIC
    appgw.ingress.kubernetes.io/health-probe-path: /health
spec:
  rules:
    - http:
        paths:
          - path: / # Every application path
            pathType: Prefix
            backend: # Destination for matching requests
              service:
                name: landing-zone-demo-app
                port:
                  name: http
