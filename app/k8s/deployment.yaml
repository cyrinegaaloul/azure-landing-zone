apiVersion: apps/v1
kind: Deployment
metadata:
  name: landing-zone-demo-app
  namespace: demo
  labels:
    app: landing-zone-demo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: landing-zone-demo-app
  template:
    metadata:
      labels:
        app: landing-zone-demo-app
        app.kubernetes.io/name: landing-zone-demo-app
        app.kubernetes.io/part-of: landing-zone-demo
    spec:
      containers:
        - name: landing-zone-demo-app
          image: landing-zone-demo-app:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: landing-zone-demo-app-config
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 12
