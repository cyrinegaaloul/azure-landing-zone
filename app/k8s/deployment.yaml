apiVersion: apps/v1
kind: Deployment
metadata:
  name: landing-zone-demo-app
  namespace: demo
  labels:
    app: landing-zone-demo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: landing-zone-demo-app
  template:
    metadata:
      labels:
        app: landing-zone-demo-app
        app.kubernetes.io/name: landing-zone-demo-app
        app.kubernetes.io/part-of: landing-zone-demo
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: landing-zone-demo
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: landing-zone-demo-app
          image: REPLACE_WITH_IMAGE_REFERENCE
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false # No additional process privileges
            capabilities:
              drop:
                - ALL # No additional Linux capabilities
            readOnlyRootFilesystem: true
          envFrom:
            - configMapRef:
                name: landing-zone-demo-app-config
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 12
          volumeMounts: # Mount the CSI volume inside the container
            - name: secrets-store-inline
              mountPath: /mnt/secrets-store
              readOnly: true
      volumes:
        - name: secrets-store-inline
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: landing-zone-demo
