# Azure-supported AKS Application Routing controller. AGIC is intentionally not
# used: Application Gateway continues to terminate WAF traffic and forwards to
# APIM, while this internal controller serves only the APIM-to-AKS hop.
apiVersion: approuting.kubernetes.azure.com/v1alpha1
kind: NginxIngressController
metadata:
  name: alz-internal
spec:
  ingressClassName: alz-internal
  controllerNamePrefix: alz-internal
  loadBalancerAnnotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"
    service.beta.kubernetes.io/azure-load-balancer-internal-subnet: "REPLACE_WITH_AKS_SUBNET_NAME"
    service.beta.kubernetes.io/azure-load-balancer-ipv4: "REPLACE_WITH_AKS_BACKEND_IP"
    service.beta.kubernetes.io/azure-load-balancer-health-probe-request-path: "/healthz"
