apiVersion: v1
kind: Service
metadata:
  name: landing-zone-demo-frontend
  namespace: demo
  labels:
    app: landing-zone-demo-frontend
spec:
  selector:
    app: landing-zone-demo-frontend
  ports:
    - name: http
      protocol: TCP
      port: 80 # Service port
      targetPort: 8080 # Pod port
  # Only the managed ingress controller has a private LoadBalancer. This
  # backend remains cluster-internal and cannot be reached directly from APIM.
  type: ClusterIP
