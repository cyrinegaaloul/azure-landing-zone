apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: landing-zone-demo
  namespace: demo
spec:
  provider: azure
  parameters:
    usePodIdentity: "false" # don't use the legacy Azure Pod Identity mechanism
    clientID: "REPLACE_WITH_MANAGED_IDENTITY_CLIENT_ID"
    keyvaultName: "REPLACE_WITH_KEY_VAULT_NAME"
    objects: |
      array:
        - |
          objectName: demo-secret
          objectType: secret
          objectVersion: ""
    tenantId: "REPLACE_WITH_TENANT_ID"
