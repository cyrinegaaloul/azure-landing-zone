apiVersion: v1
kind: ConfigMap
metadata:
  name: landing-zone-demo-frontend-config
  namespace: demo
data:
  APP_NAME: landing-zone-demo-frontend
  APP_ENV: demo
  APP_VERSION: "0.1.0"
  # Rendered from environment-specific deployment configuration. Empty keeps
  # the independently deployable frontend healthy until P4D is available.
  BACKEND_API_URL: "REPLACE_WITH_BACKEND_API_URL"
  APP_MOUNTED_FILE_PATH: /mnt/secrets-store/demo-secret
