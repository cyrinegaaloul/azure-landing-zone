name: validate-build-publish

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform validation and security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.14.6

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform init without backend
        run: terraform -chdir=terraform/root init -backend=false -input=false

      - name: Terraform validate
        run: terraform -chdir=terraform/root validate

      - name: Validate state bootstrap configuration
        run: |
          terraform -chdir=terraform/bootstrap-state init -backend=false -input=false
          terraform -chdir=terraform/bootstrap-state validate

      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: v0.73.0
          cache: true

      - name: Scan Terraform configuration
        run: trivy config --format table --severity HIGH,CRITICAL --exit-code 1 terraform

  application:
    name: Application, manifests, and image
    needs: terraform
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Python syntax and unit tests
        working-directory: app
        run: |
          python -m py_compile server.py test_server.py
          python -m unittest -v

      - name: Install kubeconform
        env:
          KUBECONFORM_VERSION: v0.7.0
        run: |
          curl --fail --location --show-error \
            --output kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar -xzf kubeconform.tar.gz
          sudo mv kubeconform /usr/local/bin/

      - name: Render Kubernetes manifests
        shell: pwsh
        run: |
          ./scripts/render-kubernetes.ps1 `
            -WorkloadIdentityClientId '00000000-0000-0000-0000-000000000000' `
            -TenantId '00000000-0000-0000-0000-000000000000' `
            -KeyVaultName 'kv-alz-dev-validation' `
            -ImageReference 'ghcr.io/example/landing-zone-demo-app@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' `
            -BackendIp '10.10.2.10' `
            -ApimSubnetCidr '10.10.4.0/24' `
            -AksSubnetCidr '10.10.2.0/24' `
            -PrivateEndpointSubnetCidr '10.10.1.0/24' `
            -OutputPath '${{ runner.temp }}/rendered-manifests.yaml'

      - name: Validate Kubernetes manifests
        run: kubeconform -strict -summary -skip SecretProviderClass "$RUNNER_TEMP/rendered-manifests.yaml"

      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: v0.73.0
          cache: true

      - name: Scan rendered Kubernetes configuration
        run: trivy config --format table --severity HIGH,CRITICAL --exit-code 1 "$RUNNER_TEMP/rendered-manifests.yaml"

      - name: Render and validate monitoring configuration
        run: |
          kubectl kustomize monitoring > "$RUNNER_TEMP/rendered-monitoring.yaml"
          kubeconform -strict -summary -skip ServiceMonitor "$RUNNER_TEMP/rendered-monitoring.yaml"
          trivy config --format table --severity HIGH,CRITICAL --exit-code 1 "$RUNNER_TEMP/rendered-monitoring.yaml"

      - name: Validate repository YAML and JSON syntax
        run: |
          git ls-files -z '*.yaml' '*.yml' | xargs -0 ruby -rpsych -e 'ARGV.each { |path| Psych.parse_stream(File.read(path)); puts "Valid YAML: #{path}" }'
          python -m json.tool monitoring/grafana-dashboard.json > /dev/null

      - name: Set immutable image name
        shell: bash
        run: |
          echo "IMAGE_REPOSITORY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/landing-zone-demo-app" >> "$GITHUB_ENV"
          echo "IMAGE_REFERENCE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/landing-zone-demo-app:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Build Docker image once
        run: docker build --tag "$IMAGE_REFERENCE" ./app

      - name: Report HIGH and CRITICAL image vulnerabilities
        run: trivy image --scanners vuln --format table --severity HIGH,CRITICAL --exit-code 0 "$IMAGE_REFERENCE"

      - name: Block fixable HIGH and CRITICAL image vulnerabilities
        run: trivy image --scanners vuln --format table --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE_REFERENCE"

      - name: Generate image SBOM
        run: trivy image --scanners vuln --format cyclonedx --output image-sbom.cdx.json "$IMAGE_REFERENCE"

      - name: Upload image SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-sbom-${{ github.sha }}
          path: image-sbom.cdx.json
          retention-days: 7

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Push the scanned image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push "$IMAGE_REFERENCE"
