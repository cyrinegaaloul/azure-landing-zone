name: validate

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.6

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: terraform/root
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: terraform/root
        run: terraform validate

      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: v0.73.0
          cache: true

      - name: Scan Terraform configuration
        run: >-
          trivy config
          --format table
          --severity HIGH,CRITICAL
          --exit-code 1
          terraform

  application:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python syntax check
        run: python -m py_compile app/server.py

      - name: Docker build
        run: docker build -t landing-zone-demo-app:ci ./app

      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: v0.73.0
          cache: true

      - name: Scan Docker image
        run: >-
          trivy image
          --scanners vuln
          --format table
          --severity HIGH,CRITICAL
          --exit-code 1
          landing-zone-demo-app:ci

      - name: Install kubeconform
        env:
          KUBECONFORM_VERSION: v0.7.0
        run: |
          curl --fail --location --show-error \
            --output kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar -xzf kubeconform.tar.gz
          sudo mv kubeconform /usr/local/bin/

      - name: Render Kubernetes manifests
        run: kubectl kustomize app/k8s > "$RUNNER_TEMP/rendered-manifests.yaml"

      - name: Validate Kubernetes manifests
        run: >-
          kubeconform
          -strict
          -summary
          -skip SecretProviderClass
          "$RUNNER_TEMP/rendered-manifests.yaml"

      - name: Scan Kubernetes configuration
        run: |
          trivy config \
            --format table \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            "$RUNNER_TEMP/rendered-manifests.yaml"

      - name: Validate repository YAML syntax
        run: >-
          ruby -rpsych -e
          'ARGV.each { |path| Psych.parse_stream(File.read(path)); puts "Valid YAML: #{path}" }'
          app/openapi.yaml monitoring/*.yaml

      - name: Validate ServiceMonitor manifest
        run: >-
          kubeconform
          -strict
          -summary
          -skip ServiceMonitor
          monitoring/servicemonitor.yaml

      - name: Validate Grafana dashboard JSON
        run: python -m json.tool monitoring/grafana-dashboard.json > /dev/null

      - name: Scan monitoring configuration
        run: >-
          trivy config
          --format table
          --severity HIGH,CRITICAL
          --exit-code 1
          monitoring
