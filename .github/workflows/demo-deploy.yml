name: controlled-demo-deployment

on:
  workflow_dispatch: #manual deployment
    inputs:
      action:
        description: "Create a plan only, apply a reviewed plan, or apply a destroy plan"
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
          - destroy
      profile:
        description: "Functional deployment profile"
        required: true
        default: core
        type: choice
        options:
          - core
          - key-vault-bootstrap
          - full
          - secure

permissions: #workflow permissions
  contents: read #read repo
  id-token: write #request OIDC token for Azure login
  packages: read #read GHCR container image 

concurrency: #prevent 2 deployments from running at the same time
  group: terraform-demo-development
  cancel-in-progress: false

env: # define environment variables for all jobs
  TF_IN_AUTOMATION: true
  ARM_USE_OIDC: true
  ARM_USE_AZUREAD: true
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
  TF_VAR_location: francecentral
  TF_VAR_project_name: alz
  TF_VAR_environment: dev
  TF_VAR_owner: cyrine
  TF_VAR_role_assignments: '{}'
  TF_VAR_resource_group_locks: '{}'
  TF_VAR_enable_management_access: false
  TF_VAR_apim_sku_name: Developer_1
  TF_VAR_aks_node_count: 1
  TF_VAR_aks_node_vm_size: Standard_B2s_v2
  TF_VAR_aks_internal_load_balancer_ip: 10.10.2.10
  TF_VAR_aks_automatic_upgrade_channel: patch
  TF_VAR_aks_node_os_upgrade_channel: NodeImage

jobs:
  plan:
    name: Create and save Terraform plan
    runs-on: ubuntu-latest
    environment: demo-plan

    steps:
      - name: Require the controlled branch
        if: github.ref != 'refs/heads/main' #only allow deployments from main branch
        run: |
          echo "Deployment operations are allowed only from main."
          exit 1

      - name: Reject destroy while secure locks are enabled
        if: inputs.action == 'destroy' && inputs.profile == 'secure' #secure profile cannot be destroyed without first removing the resource group locks
        run: |
          echo "Apply the full profile first to remove CanNotDelete locks, then run destroy with the full profile."
          exit 1

      - name: Checkout repository #download the repo to the runner
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Terraform #install Terraform CLI
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.14.6

      - name: Log in to Azure with GitHub OIDC
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure deployment profile
        shell: bash
        env:
          PROFILE: ${{ inputs.profile }}
          AKS_DEPLOYER_OBJECT_ID: ${{ vars.AZURE_PRINCIPAL_OBJECT_ID }}
          PLATFORM_ADMIN_GROUP_ID: ${{ vars.PLATFORM_ADMIN_GROUP_OBJECT_ID }}
          NETWORK_OPERATOR_GROUP_ID: ${{ vars.NETWORK_OPERATOR_GROUP_OBJECT_ID }}
          SECURITY_READER_GROUP_ID: ${{ vars.SECURITY_READER_GROUP_OBJECT_ID }}
          KEY_VAULT_BOOTSTRAP_OBJECT_ID: ${{ vars.KEY_VAULT_BOOTSTRAP_PRINCIPAL_OBJECT_ID }}
        run: |
          case "$PROFILE" in
            core)
              values="false false false false false true false false Detection"
              ;;
            key-vault-bootstrap)
              values="true false false false false true false false Detection"
              ;;
            full)
              values="true true true true true false false false Detection"
              ;;
            secure)
              values="true true true true true false true false Prevention"
              ;;
          esac
          read -r key_vault private_endpoint aks edge apim public_access locks purge waf <<< "$values"
          {
            echo "TF_VAR_enable_key_vault=$key_vault"
            echo "TF_VAR_enable_key_vault_private_endpoint=$private_endpoint"
            echo "TF_VAR_enable_aks_demo=$aks"
            echo "TF_VAR_enable_edge_stack=$edge"
            echo "TF_VAR_enable_apim=$apim"
            echo "TF_VAR_key_vault_public_network_access_enabled=$public_access"
            echo "TF_VAR_enable_resource_group_locks=$locks"
            echo "TF_VAR_enable_key_vault_purge_protection=$purge"
            echo "TF_VAR_waf_policy_mode=$waf"
          } >> "$GITHUB_ENV"
          if [[ -n "$AKS_DEPLOYER_OBJECT_ID" ]]; then echo "TF_VAR_aks_deployer_principal_object_id=$AKS_DEPLOYER_OBJECT_ID" >> "$GITHUB_ENV"; fi
          if [[ -n "$PLATFORM_ADMIN_GROUP_ID" ]]; then echo "TF_VAR_platform_admin_group_object_id=$PLATFORM_ADMIN_GROUP_ID" >> "$GITHUB_ENV"; fi
          if [[ -n "$NETWORK_OPERATOR_GROUP_ID" ]]; then echo "TF_VAR_network_operator_group_object_id=$NETWORK_OPERATOR_GROUP_ID" >> "$GITHUB_ENV"; fi
          if [[ -n "$SECURITY_READER_GROUP_ID" ]]; then echo "TF_VAR_security_reader_group_object_id=$SECURITY_READER_GROUP_ID" >> "$GITHUB_ENV"; fi
          if [[ "$PROFILE" == "key-vault-bootstrap" && -n "$KEY_VAULT_BOOTSTRAP_OBJECT_ID" ]]; then echo "TF_VAR_key_vault_bootstrap_principal_object_id=$KEY_VAULT_BOOTSTRAP_OBJECT_ID" >> "$GITHUB_ENV"; fi

      - name: Initialize persistent Azure Blob state
        run: >-
          terraform -chdir=terraform/root init -input=false -reconfigure
          -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}"
          -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}"
          -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}"
          -backend-config="key=development/azure-landing-zone.tfstate"
          -backend-config="use_azuread_auth=true"
          -backend-config="use_oidc=true"
          -backend-config="client_id=${{ secrets.AZURE_CLIENT_ID }}"
          -backend-config="tenant_id=${{ secrets.AZURE_TENANT_ID }}"
          -backend-config="subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}"

      - name: Create saved plan
        shell: bash
        env:
          ACTION: ${{ inputs.action }}
        run: |
          plan_args=(-input=false -out=tfplan)
          if [[ "$ACTION" == "destroy" ]]; then plan_args+=(-destroy); fi
          terraform -chdir=terraform/root plan "${plan_args[@]}"
          terraform -chdir=terraform/root show -no-color tfplan > plan.txt

      - name: Upload saved plan for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: terraform-plan-${{ github.run_id }}
          path: |
            terraform/root/tfplan
            terraform/root/plan.txt
          retention-days: 1

  apply:
    name: Apply the exact saved plan
    if: inputs.action == 'apply' || inputs.action == 'destroy'
    needs: plan
    runs-on: ubuntu-latest
    environment: demo-apply

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.14.6

      - name: Log in to Azure with GitHub OIDC
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Initialize persistent Azure Blob state
        run: >-
          terraform -chdir=terraform/root init -input=false -reconfigure
          -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}"
          -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}"
          -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}"
          -backend-config="key=development/azure-landing-zone.tfstate"
          -backend-config="use_azuread_auth=true"
          -backend-config="use_oidc=true"
          -backend-config="client_id=${{ secrets.AZURE_CLIENT_ID }}"
          -backend-config="tenant_id=${{ secrets.AZURE_TENANT_ID }}"
          -backend-config="subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}"

      - name: Download reviewed plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: terraform-plan-${{ github.run_id }}
          path: terraform/root

      - name: Apply saved plan
        run: terraform -chdir=terraform/root apply -input=false tfplan

      - name: Deploy the exact CI image and monitoring
        if: inputs.action == 'apply' && (inputs.profile == 'full' || inputs.profile == 'secure')
        shell: pwsh
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repository = "ghcr.io/$($env:GITHUB_REPOSITORY_OWNER.ToLowerInvariant())/landing-zone-demo-app"
          $taggedImage = "${repository}:$env:GITHUB_SHA"
          $env:GHCR_TOKEN | docker login ghcr.io --username $env:GITHUB_ACTOR --password-stdin
          docker pull $taggedImage
          $imageReference = docker inspect --format '{{index .RepoDigests 0}}' $taggedImage
          if (-not $imageReference.Contains('@sha256:')) { throw 'Immutable image digest could not be resolved.' }

          $workloads = terraform -chdir=terraform/root output -json workloads | ConvertFrom-Json
          $networking = terraform -chdir=terraform/root output -json networking | ConvertFrom-Json
          $security = terraform -chdir=terraform/root output -json security_baseline | ConvertFrom-Json
          $foundation = terraform -chdir=terraform/root output -json foundation | ConvertFrom-Json

          az aks install-cli
          az aks get-credentials --resource-group $foundation.resource_groups.foundation.name --name $workloads.aks_cluster.name --overwrite-existing
          kubelogin convert-kubeconfig -l azurecli

          $authorized = $false
          for ($attempt = 1; $attempt -le 12; $attempt++) {
            kubectl auth can-i create deployments.apps --namespace demo --quiet
            if ($LASTEXITCODE -eq 0) { $authorized = $true; break }
            Start-Sleep -Seconds 10
          }
          if (-not $authorized) { throw 'AKS Azure RBAC authorization did not propagate within two minutes.' }

          ./scripts/render-kubernetes.ps1 `
            -WorkloadIdentityClientId $workloads.workload_identity.client_id `
            -TenantId '${{ secrets.AZURE_TENANT_ID }}' `
            -KeyVaultName $security.name `
            -ImageReference $imageReference `
            -BackendIp $workloads.application_backend_url.Replace('http://', '') `
            -ApimSubnetCidr $networking.subnets.apim.address_prefixes[0] `
            -AksSubnetCidr $networking.subnets.aks.address_prefixes[0] `
            -PrivateEndpointSubnetCidr $networking.subnets.'private-endpoints'.address_prefixes[0] `
            -OutputPath "$env:RUNNER_TEMP/rendered-manifests.yaml"

          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update
          helm upgrade --install monitoring prometheus-community/kube-prometheus-stack `
            --version 86.0.1 `
            --namespace monitoring `
            --create-namespace `
            --values monitoring/kube-prometheus-stack-values.yaml `
            --wait `
            --timeout 15m
          kubectl apply -k monitoring
          kubectl apply -f "$env:RUNNER_TEMP/rendered-manifests.yaml"
          kubectl rollout status deployment/landing-zone-demo-app --namespace demo --timeout 10m

      - name: Smoke test through Application Gateway and APIM
        if: inputs.action == 'apply' && (inputs.profile == 'full' || inputs.profile == 'secure')
        shell: bash
        run: |
          public_ip=$(terraform -chdir=terraform/root output -json edge | jq -r '.public_ip.address')
          curl --fail --show-error --retry 12 --retry-all-errors --retry-delay 10 "http://${public_ip}/demo/health"
          curl --fail --show-error --retry 12 --retry-all-errors --retry-delay 10 "http://${public_ip}/demo/secret-status" | jq -e '.secretMounted == true'
