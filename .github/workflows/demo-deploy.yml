name: controlled-demo-deployment

on:
  workflow_dispatch: #manual deployment
    inputs:
      action:
        description: "Create a plan only, apply a reviewed plan, or apply a destroy plan"
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
          - destroy
      profile:
        description: "Functional deployment profile"
        required: true
        default: core
        type: choice
        options:
          - core
          - key-vault-bootstrap
          - full
          - secure
      target_environment:
        description: "Deployment environment; dev uses the dev branch and prod uses main"
        required: true
        default: prod
        type: choice
        options:
          - dev
          - prod

permissions: #workflow permissions
  contents: read #read repo
  id-token: write #request OIDC token for Azure login
  packages: read #read GHCR container image 

concurrency: #prevent 2 deployments from running at the same time
  group: terraform-demo-${{ inputs.target_environment }}
  cancel-in-progress: false

env: # define environment variables for all jobs
  TF_IN_AUTOMATION: true
  ARM_USE_OIDC: true
  ARM_USE_AZUREAD: true
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
  TF_VAR_location: francecentral
  TF_VAR_project_name: alz
  TF_VAR_owner: cyrine
  TF_VAR_role_assignments: '{}'
  TF_VAR_resource_group_locks: '{}'
  TF_VAR_enable_management_access: false
  TF_VAR_apim_sku_name: Developer_1
  TF_VAR_aks_node_count: 1
  TF_VAR_aks_node_vm_size: Standard_B2s_v2
  TF_VAR_aks_internal_load_balancer_ip: 10.10.2.250
  TF_VAR_aks_automatic_upgrade_channel: patch
  TF_VAR_aks_node_os_upgrade_channel: NodeImage

jobs:
  plan:
    name: Create and save Terraform plan
    runs-on: ubuntu-latest
    environment: demo-${{ inputs.target_environment }}-plan

    steps:
      - name: Require the branch for the selected environment
        run: |
          if [[ "${{ inputs.target_environment }}" == "dev" && "${{ github.ref }}" != "refs/heads/dev" ]]; then
            echo "Development deployments are allowed only from dev."
            exit 1
          fi
          if [[ "${{ inputs.target_environment }}" == "prod" && "${{ github.ref }}" != "refs/heads/main" ]]; then
            echo "Production deployments are allowed only from main."
            exit 1
          fi

      - name: Reject destroy while secure locks are enabled
        if: inputs.action == 'destroy' && inputs.profile == 'secure' #secure profile cannot be destroyed without first removing the resource group locks
        run: |
          echo "Apply the full profile first to remove CanNotDelete locks, then run destroy with the full profile."
          exit 1

      - name: Checkout repository #download the repo to the runner
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Terraform #install Terraform CLI
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.14.6

      - name: Log in to Azure with GitHub OIDC
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure deployment profile
        shell: bash
        env:
          PROFILE: ${{ inputs.profile }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
          AKS_DEPLOYER_OBJECT_ID: ${{ vars.AZURE_PRINCIPAL_OBJECT_ID }}
          PLATFORM_ADMIN_GROUP_ID: ${{ vars.PLATFORM_ADMIN_GROUP_OBJECT_ID }}
          NETWORK_OPERATOR_GROUP_ID: ${{ vars.NETWORK_OPERATOR_GROUP_OBJECT_ID }}
          SECURITY_READER_GROUP_ID: ${{ vars.SECURITY_READER_GROUP_OBJECT_ID }}
          KEY_VAULT_BOOTSTRAP_OBJECT_ID: ${{ vars.KEY_VAULT_BOOTSTRAP_PRINCIPAL_OBJECT_ID }}
          P4D_BACKEND_URL: ${{ vars.P4D_BACKEND_URL }}
        run: |
          if [[ "$PROFILE" == "full" || "$PROFILE" == "secure" ]] && [[ -z "$AKS_DEPLOYER_OBJECT_ID" ]]; then
            echo "AZURE_PRINCIPAL_OBJECT_ID must be configured as an Environment variable for full and secure deployments. Use the GitHub deployment identity's Microsoft Entra principal (object) ID, not its client ID."
            exit 1
          fi

          case "$PROFILE" in
            core)
              values="false false false false false true false false Detection"
              ;;
            key-vault-bootstrap)
              values="true false false false false true false false Detection"
              ;;
            full)
              values="true true true true true false false false Detection"
              ;;
            secure)
              values="true true true true true false true false Prevention"
              ;;
          esac
          read -r key_vault private_endpoint aks edge apim public_access locks purge waf <<< "$values"
          {
            echo "TF_VAR_environment=$TARGET_ENVIRONMENT"
            echo "TF_VAR_enable_key_vault=$key_vault"
            echo "TF_VAR_enable_key_vault_private_endpoint=$private_endpoint"
            echo "TF_VAR_enable_aks_demo=$aks"
            echo "TF_VAR_enable_edge_stack=$edge"
            echo "TF_VAR_enable_apim=$apim"
            echo "TF_VAR_key_vault_public_network_access_enabled=$public_access"
            echo "TF_VAR_enable_resource_group_locks=$locks"
            echo "TF_VAR_enable_key_vault_purge_protection=$purge"
            echo "TF_VAR_waf_policy_mode=$waf"
          } >> "$GITHUB_ENV"
          if [[ -n "$AKS_DEPLOYER_OBJECT_ID" ]]; then echo "TF_VAR_aks_deployer_principal_object_id=$AKS_DEPLOYER_OBJECT_ID" >> "$GITHUB_ENV"; fi
          if [[ -n "$PLATFORM_ADMIN_GROUP_ID" ]]; then echo "TF_VAR_platform_admin_group_object_id=$PLATFORM_ADMIN_GROUP_ID" >> "$GITHUB_ENV"; fi
          if [[ -n "$NETWORK_OPERATOR_GROUP_ID" ]]; then echo "TF_VAR_network_operator_group_object_id=$NETWORK_OPERATOR_GROUP_ID" >> "$GITHUB_ENV"; fi
          if [[ -n "$SECURITY_READER_GROUP_ID" ]]; then echo "TF_VAR_security_reader_group_object_id=$SECURITY_READER_GROUP_ID" >> "$GITHUB_ENV"; fi
          if [[ "$PROFILE" == "key-vault-bootstrap" && -n "$KEY_VAULT_BOOTSTRAP_OBJECT_ID" ]]; then echo "TF_VAR_key_vault_bootstrap_principal_object_id=$KEY_VAULT_BOOTSTRAP_OBJECT_ID" >> "$GITHUB_ENV"; fi
          if [[ -n "$P4D_BACKEND_URL" ]]; then echo "TF_VAR_p4d_backend_url=$P4D_BACKEND_URL" >> "$GITHUB_ENV"; fi

      - name: Initialize persistent Azure Blob state
        run: >-
          terraform -chdir=terraform/root init -input=false -reconfigure
          -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}"
          -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}"
          -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}"
          -backend-config="key=${{ vars.TFSTATE_KEY }}"
          -backend-config="use_azuread_auth=true"
          -backend-config="use_oidc=true"
          -backend-config="client_id=${{ secrets.AZURE_CLIENT_ID }}"
          -backend-config="tenant_id=${{ secrets.AZURE_TENANT_ID }}"
          -backend-config="subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}"

      - name: Create saved plan
        shell: bash
        env:
          ACTION: ${{ inputs.action }}
          PROFILE: ${{ inputs.profile }}
        run: |
          plan_args=(-input=false -out=tfplan)
          if [[ "$ACTION" == "destroy" ]]; then
            plan_args+=(-destroy)
          elif [[ "$PROFILE" == "full" || "$PROFILE" == "secure" ]]; then
            # Internal-mode APIM exposes its management endpoint only to the VNet.
            # GitHub-hosted runners cannot refresh it; saved-plan apply does not
            # perform a second refresh. Move these jobs to an Azure-connected
            # runner before relying on CI to detect APIM drift.
            plan_args+=(-refresh=false)
          fi
          terraform -chdir=terraform/root plan "${plan_args[@]}"
          terraform -chdir=terraform/root show -no-color tfplan > plan.txt

      - name: Upload saved plan for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: terraform-plan-${{ github.run_id }}
          path: |
            terraform/root/tfplan
            terraform/root/plan.txt
          retention-days: 1

  apply:
    name: Apply the exact saved plan
    if: inputs.action == 'apply' || inputs.action == 'destroy'
    needs: plan
    runs-on: ubuntu-latest
    environment: demo-${{ inputs.target_environment }}-apply

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.14.6

      - name: Log in to Azure with GitHub OIDC
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Initialize persistent Azure Blob state
        run: >-
          terraform -chdir=terraform/root init -input=false -reconfigure
          -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}"
          -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}"
          -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}"
          -backend-config="key=${{ vars.TFSTATE_KEY }}"
          -backend-config="use_azuread_auth=true"
          -backend-config="use_oidc=true"
          -backend-config="client_id=${{ secrets.AZURE_CLIENT_ID }}"
          -backend-config="tenant_id=${{ secrets.AZURE_TENANT_ID }}"
          -backend-config="subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}"

      - name: Download reviewed plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: terraform-plan-${{ github.run_id }}
          path: terraform/root

      - name: Apply saved plan
        run: terraform -chdir=terraform/root apply -input=false tfplan

      - name: Refresh Azure login before AKS deployment
        if: inputs.action == 'apply' && (inputs.profile == 'full' || inputs.profile == 'secure')
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy the exact frontend image, ingress, and managed-metrics scrape configuration
        if: inputs.action == 'apply' && (inputs.profile == 'full' || inputs.profile == 'secure')
        shell: pwsh
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          P4D_BACKEND_URL: ${{ vars.P4D_BACKEND_URL }}
          AKS_DEPLOYER_OBJECT_ID: ${{ vars.AZURE_PRINCIPAL_OBJECT_ID }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repository = "ghcr.io/$($env:GITHUB_REPOSITORY_OWNER.ToLowerInvariant())/landing-zone-demo-frontend"
          $taggedImage = "${repository}:$env:GITHUB_SHA"
          $env:GHCR_TOKEN | docker login ghcr.io --username $env:GITHUB_ACTOR --password-stdin
          docker pull $taggedImage
          $imageReference = docker inspect --format '{{index .RepoDigests 0}}' $taggedImage
          if (-not $imageReference.Contains('@sha256:')) { throw 'Immutable image digest could not be resolved.' }

          $workloads = terraform -chdir=terraform/root output -json workloads | ConvertFrom-Json
          $networking = terraform -chdir=terraform/root output -json networking | ConvertFrom-Json
          $security = terraform -chdir=terraform/root output -json security_baseline | ConvertFrom-Json
          $foundation = terraform -chdir=terraform/root output -json foundation | ConvertFrom-Json
          $observability = terraform -chdir=terraform/root output -json observability | ConvertFrom-Json
          $backendIp = $workloads.application_backend_url.Replace('http://', '')

          if (-not $observability.azure_monitor_workspace.id -or -not $observability.managed_grafana.id) {
            throw 'Azure-managed monitoring outputs are missing.'
          }
          az resource show --ids $observability.azure_monitor_workspace.id --api-version 2023-04-03 | Out-Null
          az resource show --ids $observability.managed_grafana.id --api-version 2023-09-01 | Out-Null

          az aks install-cli
          az aks get-credentials --resource-group $foundation.resource_groups.foundation.name --name $workloads.aks_cluster.name --overwrite-existing
          kubelogin convert-kubeconfig -l azurecli

          $authorized = $false
          $maxAttempts = 60
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host "Checking AKS Azure RBAC authorization ($attempt/$maxAttempts)..."
            $canIResult = (& kubectl auth can-i create deployments.apps --namespace demo --request-timeout=20s 2>&1 | Out-String).Trim()
            $canIExitCode = $LASTEXITCODE

            if ($canIExitCode -eq 0 -and $canIResult -eq "yes") {
              $authorized = $true
              break
            }

            if ($attempt -eq 1 -or $attempt % 6 -eq 0) {
              Write-Host "Authorization check result: $canIResult"
              kubectl auth can-i get pods --namespace demo --request-timeout=20s
            }

            Start-Sleep -Seconds 10
          }
          if (-not $authorized) {
            Write-Host "Current Kubernetes context: $(kubectl config current-context)"
            Write-Host "Azure RBAC assignments for the configured GitHub deployment principal:"
            az role assignment list --assignee-object-id $env:AKS_DEPLOYER_OBJECT_ID --scope $workloads.aks_cluster.id --include-inherited --query "[].{role:roleDefinitionName,scope:scope,principal:principalId}" --output table
            Write-Host "Effective Kubernetes permissions in namespace demo:"
            kubectl auth can-i --list --namespace demo
            throw 'AKS Azure RBAC authorization was not available within ten minutes. Confirm AZURE_PRINCIPAL_OBJECT_ID is the GitHub OIDC identity principal ID and has Azure Kubernetes Service RBAC Cluster Admin at the AKS cluster scope.'
          }

          ./scripts/render-kubernetes.ps1 `
            -WorkloadIdentityClientId $workloads.workload_identity.client_id `
            -TenantId '${{ secrets.AZURE_TENANT_ID }}' `
            -KeyVaultName $security.name `
            -ImageReference $imageReference `
            -BackendIp $backendIp `
            -AksSubnetName $networking.subnets.aks.name `
            -ApimSubnetCidr $networking.subnets.apim.address_prefixes[0] `
            -AksSubnetCidr $networking.subnets.aks.address_prefixes[0] `
            -PrivateEndpointSubnetCidr $networking.subnets.'private-endpoints'.address_prefixes[0] `
            -BackendApiUrl $env:P4D_BACKEND_URL `
            -OutputPath "$env:RUNNER_TEMP/rendered-manifests.yaml"

          kubectl apply -f "$env:RUNNER_TEMP/rendered-manifests.yaml"
          kubectl wait --for=condition=Available nginxingresscontroller/alz-internal --timeout=10m
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Application Routing controller diagnostics:"
            kubectl get nginxingresscontroller alz-internal -o yaml
            kubectl get deployment,pods,service --namespace app-routing-system -o wide
            kubectl describe deployment alz-internal-0 --namespace app-routing-system
            kubectl describe pods --namespace app-routing-system -l app.kubernetes.io/instance=alz-internal-0
            kubectl get events --namespace app-routing-system --sort-by=.lastTimestamp
            kubectl logs deployment/alz-internal-0 --namespace app-routing-system --all-containers --tail=200
            throw "AKS Application Routing controller did not become available within ten minutes. Review the controller diagnostics above."
          }
          kubectl apply -k monitoring
          kubectl rollout status deployment/landing-zone-demo-frontend --namespace demo --timeout 10m

          $ingressReady = $false
          for ($attempt = 1; $attempt -le 60; $attempt++) {
            $assignedIp = kubectl get ingress landing-zone-demo-frontend --namespace demo -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>$null
            if ($assignedIp -eq $backendIp) {
              $ingressReady = $true
              break
            }
            Start-Sleep -Seconds 10
          }
          if (-not $ingressReady) {
            kubectl get nginxingresscontroller alz-internal -o yaml
            kubectl get ingress landing-zone-demo-frontend --namespace demo -o wide
            kubectl describe ingress landing-zone-demo-frontend --namespace demo
            throw "AKS internal ingress did not acquire expected IP $backendIp within ten minutes."
          }

          kubectl get podmonitor landing-zone-demo-frontend --namespace demo
          kubectl exec deployment/landing-zone-demo-frontend --namespace demo -- python -c "import urllib.request; assert b'demo_app_http_requests_total' in urllib.request.urlopen('http://127.0.0.1:8080/metrics').read()"

      - name: P4D backend deployment interface (awaiting access)
        if: inputs.action == 'apply' && (inputs.profile == 'full' || inputs.profile == 'secure')
        shell: bash
        run: |
          echo "P4D deployment was intentionally not attempted."
          echo "Provide the P4D access method, environment, backend URL, and APIM connectivity details before wiring p4d/dev.jps or p4d/prod.jps into CI."

      - name: Smoke test through Application Gateway and APIM
        if: inputs.action == 'apply' && (inputs.profile == 'full' || inputs.profile == 'secure')
        shell: bash
        run: |
          public_ip=$(terraform -chdir=terraform/root output -json edge | jq -r '.public_ip.address')
          curl --fail --show-error --retry 12 --retry-all-errors --retry-delay 10 "http://${public_ip}/demo/health"
          curl --fail --show-error --retry 12 --retry-all-errors --retry-delay 10 "http://${public_ip}/demo/secret-status" | jq -e '.secretMounted == true'
